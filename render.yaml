services:
  - type: web
    name: event-around-api
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: APP_TIMEZONE
        value: Asia/Bangkok
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: DATABASE_URL
        fromDatabase:
          name: event-around-postgres
          property: connectionString
    preDeployCommand: alembic upgrade head

databases:
  - name: event-around-postgres
    databaseName: event_around_db
    user: event_user
    plan: starter