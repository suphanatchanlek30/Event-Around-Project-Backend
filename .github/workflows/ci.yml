name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests alembic/env.py
          black --check app tests alembic/env.py

      - name: Run tests
        env:
          APP_ENV: test
          APP_DEBUG: "false"
        run: |
          python -m pytest -ra -W default

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: event_user
          POSTGRES_PASSWORD: event_pass
          POSTGRES_DB: event_around_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_user -d event_around_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          APP_ENV: test
          APP_DEBUG: "false"
          DATABASE_URL: postgresql+psycopg://event_user:event_pass@localhost:5432/event_around_test
        run: |
          alembic upgrade head